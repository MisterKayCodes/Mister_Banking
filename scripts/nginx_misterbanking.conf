server {
    listen 80;
    server_name sterlingarchertrust.com www.sterlingarchertrust.com; # Production Domain

    # ## FRONTEND: The Digital Vault Interface
    # This is where your built React files live on the VPS.
    root /var/www/misterbanking/dist;
    index index.html;

    # ## SPA ROUTING
    # This ensures that refreshing the page on /settings or /dashboard doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ## BACKEND API: The Institutional Core
    # We proxy all API prefixes to the Gunicorn/Uvicorn server.
    location ~ ^/(auth|users|accounts|transactions|admin|notifications) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ## STATIC ASSETS (Kyc Uploads, etc.)
    location /static {
        alias /var/www/misterbanking/app/static;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ## SECURITY HEADERS
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
